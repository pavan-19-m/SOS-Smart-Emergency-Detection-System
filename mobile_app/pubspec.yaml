name: sosense_mobile
description: SOSense — Intelligent Sensor-Based Emergency Detection & Data Analytics Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1

  # Firebase Backend
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  firebase_app_check: ^0.3.1+6

  # Sensors, GPS & Connectivity
  sensors_plus: ^6.1.0
  geolocator: ^13.0.1
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1

  # Local Storage & Notifications
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/sosense_inference_bundle.json
